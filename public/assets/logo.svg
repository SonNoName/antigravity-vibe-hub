<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Quantum Core -->
  <circle cx="50" cy="50" r="12" fill="url(#orbitGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
  
  <!-- Orbital Ring 1 -->
  <ellipse cx="50" cy="50" rx="38" ry="16" stroke="#00f5ff" stroke-width="2" stroke-dasharray="4 4" transform="rotate(-30 50 50)" opacity="0.8" />
  <circle cx="20" cy="35" r="3.5" fill="#00f5ff" filter="url(#glow)" />
  
  <!-- Orbital Ring 2 -->
  <ellipse cx="50" cy="50" rx="38" ry="16" stroke="#ff007f" stroke-width="2" stroke-dasharray="6 3" transform="rotate(45 50 50)" opacity="0.8" />
  <circle cx="80" cy="65" r="3.5" fill="#ff007f" filter="url(#glow)" />

  <!-- Orbital Ring 3 -->
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="#00ff88" stroke-width="1.5" transform="rotate(85 50 50)" opacity="0.7" />
  <circle cx="50" cy="14" r="3" fill="#00ff88" filter="url(#glow)" />
</svg>
